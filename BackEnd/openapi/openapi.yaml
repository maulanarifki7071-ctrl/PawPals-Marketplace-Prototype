components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: pawpals_session
      description: Server-managed opaque session cookie. Browser cookie is HttpOnly; Secure on HTTPS. Cookie name is an implementation
        convention for the codebase.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Success:
      description: Successful response using the PawPals success envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Paginated:
      description: Paginated collection response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedEnvelope'
    Error:
      description: Canonical PawPals error envelope. Frontend branches on error.code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    UUID:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
    MoneyIDR:
      type: integer
      format: int64
      minimum: 0
      description: Integer IDR. No floating-point nominal.
    PositiveMoneyIDR:
      type: integer
      format: int64
      minimum: 1
      description: Positive integer IDR. Rp0/free booking is outside MVP.
    GenericWritePayload:
      type: object
      additionalProperties: true
      description: Placeholder only where the frozen API Contract defines the endpoint/behavior but does not freeze every
        payload field. Must be narrowed before endpoint implementation.
    SuccessEnvelope:
      type: object
      required:
      - data
      - request_id
      properties:
        data: {}
        request_id:
          type: string
          format: uuid
      additionalProperties: false
    PaginatedEnvelope:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          type: object
          required:
          - items
          - page
          - limit
          - total
          - total_pages
          properties:
            items:
              type: array
              items: {}
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
            total_pages:
              type: integer
              minimum: 0
          additionalProperties: false
        request_id:
          type: string
          format: uuid
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          additionalProperties: false
        request_id:
          type: string
          format: uuid
      additionalProperties: false
    RegisterRequest:
      type: object
      required:
      - phone_e164
      - password
      - display_name
      properties:
        phone_e164:
          type: string
          pattern: ^[+][1-9][0-9]{7,14}$
          examples:
          - '+6281234567890'
        password:
          type: string
          format: password
          minLength: 8
        display_name:
          type: string
          minLength: 1
          maxLength: 150
      additionalProperties: false
    OtpVerifyRequest:
      type: object
      required:
      - challenge_id
      - code
      properties:
        challenge_id:
          $ref: '#/components/schemas/UUID'
        code:
          type: string
          pattern: ^[0-9]{6}$
      additionalProperties: false
    OtpResendRequest:
      type: object
      required:
      - challenge_id
      properties:
        challenge_id:
          $ref: '#/components/schemas/UUID'
      additionalProperties: false
    LoginRequest:
      type: object
      required:
      - phone_e164
      - password
      properties:
        phone_e164:
          type: string
          pattern: ^[+][1-9][0-9]{7,14}$
        password:
          type: string
          format: password
      additionalProperties: false
    ForgotPasswordRequest:
      type: object
      required:
      - phone_e164
      properties:
        phone_e164:
          type: string
          pattern: ^[+][1-9][0-9]{7,14}$
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      required:
      - reset_authorization
      - new_password
      properties:
        reset_authorization:
          type: string
        new_password:
